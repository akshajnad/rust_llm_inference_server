[package]
name = "model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2-metal", "dep:objc2"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
half = "2"
candle-metal-kernels = { version = "=0.11.0", optional = true }
objc2-metal = { version = "=0.3.2", optional = true }
objc2 = { version = "=0.6.5", optional = true }

[dev-dependencies]
tokenizers.workspace = true

# GPU profiling tools; they use Metal-only kernels.
[[example]]
name = "decode_profile"
required-features = ["metal"]

[[example]]
name = "prefill_profile"
required-features = ["metal"]

[[example]]
name = "attn_bench"
required-features = ["metal"]
